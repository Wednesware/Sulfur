name: Test and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and archive validation
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q sulfur examples tests tools

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wednesware/Fluorine
          ref: '26.7'
          path: .integration/Fluorine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt and pywebview
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1
          python -m pip install pywebview PySide6 qtpy
      - name: Exercise real Python callbacks and DOM updates
        env:
          PYTHONPATH: .:.integration/Fluorine
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          timeout 60s xvfb-run -a python tests/desktop_smoke.py
          timeout 60s xvfb-run -a python tests/desktop_smoke.py --file

  release:
    if: github.event_name != 'pull_request'
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build clean Nitrogen archive
        run: python tools/build_release.py
      - name: Publish a new version after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; leaving it unchanged."
            exit 0
          fi
          tail -n +3 CHANGELOG.md > dist/release-notes.md
          gh release create "$version" dist/sulfur.zip \
            --target "$GITHUB_SHA" --title "$version" \
            --notes-file dist/release-notes.md --latest
